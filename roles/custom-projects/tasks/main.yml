---
- name: Ensure tools directory exists
  file:
    path: "{{ ansible_env.HOME }}/tools"
    state: directory
    mode: "0755"

- name: Clone custom projects
  git:
    repo: "{{ item.repo }}"
    dest: "{{ ansible_env.HOME }}/tools/{{ item.name }}"
    version: "{{ item.version | default('master') }}"
    update: true
  loop: "{{ custom_projects }}"
